summary = "Dialingo"
description = """ਇੱਕ ਐਡ-ਆਨ ਜੋ ਤੁਹਾਨੂੰ ਆਪਣੀ ਬੋਲੀ ਜਾਣ ਵਾਲੀ ਹਰ ਭਾਸ਼ਾ ਨੂੰ ਉਸਦੀਆਂ ਆਪਣੀਆਂ ਸਿੰਥੇਸਾਈਜ਼ਰ, ਆਵਾਜ਼, ਗਤੀ, ਵਿਰਾਮ ਚਿੰਨ੍ਹ ਅਤੇ ਸ਼ਬਦਕੋਸ਼ ਸੈਟਿੰਗਾਂ ਨਾਲ ਸੈੱਟ ਕਰਨ ਦਿੰਦਾ ਹੈ। ਇਹ ਉਹਨਾਂ ਵਿਚਕਾਰ ਉਦੋਂ ਵੀ ਬਦਲਦਾ ਹੈ ਜਦੋਂ ਪਾਠ ਉੱਤੇ ਉਸਦੀ ਭਾਸ਼ਾ ਦਾ ਟੈਗ ਨਾ ਹੋਵੇ, ਅਤੇ ਉਦੋਂ ਵੀ ਜਦੋਂ ਭਾਸ਼ਾ ਵਾਕ ਦੇ ਵਿਚਕਾਰ ਬਦਲ ਜਾਵੇ।"""
