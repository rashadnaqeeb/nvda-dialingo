summary = "Monikielinen puhe"
description = """Lisäosa, jolla voit määrittää jokaiselle puhumallesi kielelle omat syntetisaattori-, ääni-, nopeus-, välimerkki- ja sanastoasetukset. Se vaihtaa niiden välillä silloinkin, kun tekstiin ei ole merkitty sen kieltä, ja silloinkin, kun kieli vaihtuu kesken lauseen."""
