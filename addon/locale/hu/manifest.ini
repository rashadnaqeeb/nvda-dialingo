summary = "Többnyelvű beszéd"
description = """Kiegészítő, amellyel minden beszélt nyelvét saját beszédszintetizátor-, hang-, sebesség-, írásjel- és szótárbeállításokkal állíthatja be. Akkor is vált közöttük, ha a szöveg nincs megjelölve a nyelvével, és akkor is, ha a nyelv mondat közben változik."""
