summary = "Dialingo"
description = """Një shtesë që ju lejon të konfiguroni çdo gjuhë që flisni me cilësimet e veta për sintetizatorin, zërin, shpejtësinë, pikësimin dhe fjalorin. Kalon nga njëra te tjetra edhe kur teksti nuk është etiketuar me gjuhën e vet, dhe edhe kur gjuha ndryshon në mes të fjalisë."""
