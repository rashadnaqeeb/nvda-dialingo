summary = "Dialingo"
description = """Додаток, який дає змогу налаштувати кожну мову, якою ви розмовляєте, з власними параметрами синтезатора, голосу, швидкості, пунктуації та словника. Він перемикається між ними, навіть коли текст не позначено його мовою, і навіть коли мова змінюється посеред речення."""
