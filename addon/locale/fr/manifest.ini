summary = "Dialingo"
description = """Une extension qui vous permet de configurer chaque langue que vous parlez avec ses propres réglages de synthétiseur, de voix, de débit, de ponctuation et de dictionnaire. Elle passe de l'une à l'autre même quand le texte n'est pas marqué avec sa langue, et même quand la langue change au milieu d'une phrase."""
