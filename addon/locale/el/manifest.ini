summary = "Dialingo"
description = """Ένα πρόσθετο που σας επιτρέπει να ρυθμίσετε κάθε γλώσσα που μιλάτε με τις δικές της ρυθμίσεις συνθέτη, φωνής, ταχύτητας, στίξης και λεξικού. Εναλλάσσει μεταξύ τους ακόμη κι όταν το κείμενο δεν έχει επισημανθεί με τη γλώσσα του, και ακόμη κι όταν η γλώσσα αλλάζει στη μέση μιας πρότασης."""
