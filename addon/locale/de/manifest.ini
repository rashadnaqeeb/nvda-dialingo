summary = "Dialingo"
description = """Eine Erweiterung, mit der Sie jede Sprache, die Sie sprechen, mit eigenen Einstellungen für Sprachausgabe, Stimme, Geschwindigkeit, Satzzeichen und Wörterbuch einrichten. Sie wechselt zwischen ihnen, auch wenn der Text nicht mit seiner Sprache markiert ist, und auch wenn die Sprache mitten im Satz wechselt."""
