summary = "Voz multilingüe"
description = """Un complemento que le permite configurar cada idioma que charra con os suyos propios achustes de sintetizador, voz, velocidat, puntuación y diccionario. Cambea entre ells mesmo quan o texto no ye etiquetau con o suyo idioma, y mesmo quan l'idioma cambea en meyo d'una frase."""
