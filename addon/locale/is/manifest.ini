summary = "Dialingo"
description = """Viðbót sem gerir þér kleift að stilla hvert tungumál sem þú talar með eigin stillingum fyrir talgervil, rödd, hraða, greinarmerki og orðabók. Hún skiptir á milli þeirra jafnvel þegar texti er ekki merktur með tungumáli sínu, og jafnvel þegar tungumálið breytist í miðri setningu."""
