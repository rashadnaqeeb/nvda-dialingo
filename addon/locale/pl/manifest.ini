summary = "Dialingo"
description = """Dodatek, który pozwala skonfigurować każdy używany język z własnymi ustawieniami syntezatora, głosu, szybkości, interpunkcji i słownika. Przełącza się między nimi nawet wtedy, gdy tekst nie jest oznaczony swoim językiem, i nawet wtedy, gdy język zmienia się w środku zdania."""
