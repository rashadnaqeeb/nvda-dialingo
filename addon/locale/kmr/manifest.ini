summary = "Axaftina pirzimanî"
description = """Pêvekek ku dihêle tu her zimanê ku tu diaxivî bi mîhengên xwe yên sentezker, deng, lez, xalbendî û ferhengê saz bikî. Ew di navbera wan de diguhere, heta dema ku nivîs bi zimanê xwe nehatibe nîşankirin, û heta dema ku ziman di nîvê hevokê de diguhere."""
