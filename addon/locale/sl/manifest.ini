summary = "Večjezični govor"
description = """Dodatek, ki vam omogoča, da za vsak jezik, ki ga govorite, nastavite lastne nastavitve sintetizatorja, glasu, hitrosti, ločil in slovarja. Med njimi preklaplja, tudi ko besedilo ni označeno s svojim jezikom, in tudi ko se jezik spremeni sredi stavka."""
