summary = "Flersproget tale"
description = """En tilføjelse, der lader dig indstille hvert sprog, du taler, med egne indstillinger for talesyntese, stemme, hastighed, tegnsætning og ordbog. Den skifter mellem dem, også når teksten ikke er mærket med sit sprog, og også når sproget skifter midt i en sætning."""
