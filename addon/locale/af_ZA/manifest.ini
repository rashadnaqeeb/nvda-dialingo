summary = "Veeltalige spraak"
description = """'n Byvoeging waarmee u elke taal wat u praat met sy eie sintetiseerder-, stem-, spoed-, leestekens- en woordeboekinstellings kan opstel. Dit wissel tussen hulle selfs wanneer teks nie met sy taal gemerk is nie, en selfs wanneer die taal in die middel van 'n sin verander."""
