summary = "کثیر لسانی تقریر"
description = """ایک ایڈ آن جو آپ کو اپنی بولی جانے والی ہر زبان کو اس کی اپنی سنتھیسائزر، آواز، رفتار، رموزِ اوقاف اور لغت کی ترتیبات کے ساتھ سیٹ کرنے دیتا ہے۔ یہ ان کے درمیان تب بھی بدلتا ہے جب متن پر اس کی زبان کا ٹیگ نہ ہو، اور تب بھی جب زبان جملے کے بیچ میں بدل جائے۔"""
