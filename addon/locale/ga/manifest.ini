summary = "Dialingo"
description = """Breiseán a ligeann duit gach teanga a labhraíonn tú a shocrú lena socruithe féin don sintéiseoir, don ghuth, don ráta, don phoncaíocht agus don fhoclóir. Aistríonn sé eatarthu fiú nuair nach bhfuil a teanga clibeáilte ar an téacs, agus fiú nuair a athraíonn an teanga i lár abairte."""
