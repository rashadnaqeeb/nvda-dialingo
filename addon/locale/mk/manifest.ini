summary = "Dialingo"
description = """Додаток што ви овозможува да го поставите секој јазик што го зборувате со сопствени поставки за синтетизатор, глас, брзина, интерпункција и речник. Префрла меѓу нив дури и кога текстот не е означен со својот јазик, и дури и кога јазикот се менува среде реченица."""
