name = "dialingo"
summary = "Dialingo"
description = """An addon that lets you set up each language you speak with its own synth, voice, rate, punctuation, and dictionary settings. It switches between them even when text isn't tagged with its language, and even when the language changes mid-sentence."""
author = "Rashad Naqeeb"
url = "https://github.com/rashadnaqeeb/nvda-dialingo/blob/main/addon/doc/en/readme.md"
version = "1.0.3"
changelog = """Languages set up before 1.0.1 on your usual synthesizer with a different voice now speak in that voice, without having to save the settings again.
Brackets around text in another language are now read by that language's voice, not the voice of the text before them.
With Vocalizer Expressive, text in a dialect it has no voice for is now read by a matching Windows voice if you have one, or has its punctuation read in your default language."""
docFileName = "readme.html"
minimumNVDAVersion = 2026.1.0
lastTestedNVDAVersion = 2026.2.0
updateChannel = None
