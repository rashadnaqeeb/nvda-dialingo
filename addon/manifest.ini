name = "dialingo"
summary = "Dialingo"
description = """An addon that lets you set up each language you speak with its own synth, voice, rate, punctuation, and dictionary settings. It switches between them even when text isn't tagged with its language, and even when the language changes mid-sentence."""
author = "Rashad Naqeeb"
url = "https://github.com/rashadnaqeeb/nvda-dialingo/blob/main/addon/doc/en/readme.md"
version = "1.1.1"
changelog = """Each language's voice dictionary now applies only to the text that voice reads. Your usual voice's dictionary no longer changes text read by another language's voice.
On NVDA 2026.3, the Dictionary button for a language that uses your usual voice opens NVDA's own voice dictionary again.
Styled letters, like the bold or italic ones in social media posts, are now read in the language of the words they spell.
With Eloquence C as your usual synth, NVDA's speech settings open again with the language table, and its Language setting lists Eloquence's own languages. Capital letters on Eloquence C are no longer spoken at maximum pitch.
With Google TTS For NVDA, the language dialog lists the speakers of the voice you pick, so the Arabic voice shows its Arabic speakers."""
docFileName = "readme.html"
minimumNVDAVersion = 2026.1.0
lastTestedNVDAVersion = 2026.3.0
updateChannel = None
